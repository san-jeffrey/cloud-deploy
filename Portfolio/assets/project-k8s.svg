<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-labs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="labs-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-labs)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M 0,75 L 800,75 M 0,150 L 800,150 M 0,225 L 800,225 M 0,300 L 800,300 M 0,375 L 800,375"/>
    <path d="M 100,0 L 100,450 M 200,0 L 200,450 M 300,0 L 300,450 M 400,0 L 400,450 M 500,0 L 500,450 M 600,0 L 600,450 M 700,0 L 700,450"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="28" width="370" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="225" y="50" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">🛠️ HANDS-ON INFRASTRUCTURE LABS</text>

  <!-- Central Infrastructure Cluster Diagram -->
  <g transform="translate(400, 230)">
    <!-- Central Cloud Node (AWS) -->
    <circle r="60" fill="#1e293b" stroke="#ff9900" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" fill="#ff9900" font-family="sans-serif" font-size="13" font-weight="bold">AWS Cloud</text>
    <text x="0" y="15" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">EC2 • S3 • VPC</text>

    <!-- Branch 1: Linux Admin -->
    <line x1="-50" y1="-35" x2="-160" y2="-90" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-250" y="-125" width="130" height="65" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="-185" y="-100" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Linux Admin</text>
    <text x="-185" y="-80" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Bash • SSH • CLI</text>

    <!-- Branch 2: Docker & Containers -->
    <line x1="50" y1="-35" x2="160" y2="-90" stroke="#0284c7" stroke-width="2"/>
    <rect x="120" y="-125" width="130" height="65" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <text x="185" y="-100" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Docker</text>
    <text x="185" y="-80" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Compose • Images</text>

    <!-- Branch 3: Terraform IaC -->
    <line x1="-50" y1="35" x2="-160" y2="85" stroke="#844fba" stroke-width="2"/>
    <rect x="-250" y="55" width="130" height="65" rx="8" fill="#0f172a" stroke="#844fba" stroke-width="2"/>
    <text x="-185" y="80" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">Terraform IaC</text>
    <text x="-185" y="100" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">IaC Provisioning</text>

    <!-- Branch 4: Kubernetes -->
    <line x1="50" y1="35" x2="160" y2="85" stroke="#326ce5" stroke-width="2"/>
    <rect x="120" y="55" width="130" height="65" rx="8" fill="#0f172a" stroke="#326ce5" stroke-width="2"/>
    <text x="185" y="80" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">Kubernetes</text>
    <text x="185" y="100" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Pods &amp; Services</text>
  </g>

  <!-- Bottom Details Tag -->
  <rect x="180" y="380" width="440" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="401" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">✔ Continuous Hands-On Labs &amp; Cloud Practice</text>
</svg>

